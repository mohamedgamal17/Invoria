
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD != '' && secrets.CI_SQL_SA_PASSWORD || 'Invoria_CI_Strong_P@ssw0rd!' }}
        ports:
          - 1433:1433

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

      CI_SQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD != '' && secrets.CI_SQL_SA_PASSWORD || 'Invoria_CI_Strong_P@ssw0rd!' }}

      CI_DB_CONNECTION_STRING: Server=localhost,1433;Database=Invoria_CI;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD != '' && secrets.CI_SQL_SA_PASSWORD || 'Invoria_CI_Strong_P@ssw0rd!' }};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Invoria.sln

      - name: Build solution
        run: dotnet build Invoria.sln --configuration Release --no-restore

      - name: Install sqlcmd client
        shell: bash
        run: |
          set -euo pipefail

          # Reuse Microsoft's existing repository configuration.
          # Avoid creating a duplicate repository with a conflicting key.
          sudo rm -f /etc/apt/sources.list.d/mssql-release.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 \
            unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

          sqlcmd -? | head -n 5

      - name: Wait for SQL Server readiness
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if /opt/mssql-tools18/bin/sqlcmd \
              -S localhost,1433 \
              -U sa \
              -P "$CI_SQL_SA_PASSWORD" \
              -C \
              -b \
              -Q "SELECT 1"; then

              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server... ($i/60)"
            sleep 2
          done

          echo "::error::SQL Server failed to become ready within 120 seconds."
          exit 1

      - name: Run all test projects
        shell: pwsh
        env:
          ConnectionStrings__Default: ${{ env.CI_DB_CONNECTION_STRING }}
          ConnectionStrings__Rebus: ${{ env.CI_DB_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'

          $resultsRoot = "TestResults"

          New-Item -Path $resultsRoot -ItemType Directory -Force |
            Out-Null

          $testProjects = @(
            "tests/Invoria.Application.Tests/Invoria.Application.Tests.csproj"
            "tests/Invoria.Endpoints.Tests/Invoria.Endpoints.Tests.csproj"

            "tests/Modules/Catalog/Catalog.Application.Tests/Invoria.Catalog.Application.Tests.csproj"
            "tests/Modules/Catalog/Catalog.Endpoints.Tests/Invoria.Catalog.Endpoints.Tests.csproj"

            "tests/Modules/CustomerManagement/CustomerManagement.Application.Tests/Invoria.CustomerManagement.Application.Tests.csproj"
            "tests/Modules/CustomerManagement/CustomerManagement.Endpoints.Tests/Invoria.CustomerManagement.Endpoints.Tests.csproj"

            "tests/Modules/Inventory/Inventory.Application.Tests/Invoria.Inventory.Application.Tests.csproj"
            "tests/Modules/Inventory/Inventory.Endpoints.Tests/Invoria.Inventory.Endpoints.Tests.csproj"

            "tests/Modules/Ordering/Ordering.Application.Tests/Invoria.Ordering.Application.Tests.csproj"
            "tests/Modules/Ordering/Ordering.Endpoints.Tests/Invoria.Ordering.Endpoints.Tests.csproj"

            "tests/Modules/Procurement/Procurement.Application.Tests/Invoria.Procurement.Application.Tests.csproj"
            "tests/Modules/Procurement/Procurement.Endpoints.Tests/Invoria.Procurement.Endpoints.Tests.csproj"
          )

          $failedProjects = @()

          foreach ($project in $testProjects) {
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($project)
            $resultsDirectory = Join-Path $resultsRoot $projectName

            New-Item -Path $resultsDirectory -ItemType Directory -Force |
              Out-Null

            Write-Host "========================================"
            Write-Host "Testing: $project"
            Write-Host "========================================"

            if (-not (Test-Path $project)) {
              Write-Host "::error::Test project not found: $project"
              $failedProjects += $project
              continue
            }

            dotnet test $project `
              --configuration Release `
              --no-build `
              --no-restore `
              --logger "trx;LogFileName=$projectName.trx" `
              --results-directory $resultsDirectory

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Tests failed for $project"
              $failedProjects += $project
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Test Summary"
          Write-Host "========================================"

          if ($failedProjects.Count -gt 0) {
            Write-Host "Failed test projects:"

            foreach ($project in $failedProjects) {
              Write-Host " - $project"
            }

            exit 1
          }

          Write-Host "All test projects passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
